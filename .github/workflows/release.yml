name: Release data bundle & typed client

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "packages/core/**"
      - "packages/client/**"
      - "scripts/build-data-bundle.ts"
      - "scripts/build-client-package.ts"
      - "scripts/export-openapi.ts"
      - "scripts/verify-data.ts"
      - "scripts/publish-data.ts"
      - "package.json"
      # Both core's and client's tsconfig chains extend this; compiler option
      # changes can alter (or break) the published client's index.d.ts.
      - "tsconfig.base.json"
      # `bun install --frozen-lockfile` resolves build dependency versions from
      # the lock; `bun update` can change it without touching any package.json,
      # and dependency versions shape the emitted d.ts and OpenAPI document.
      - "bun.lock"
      - ".github/workflows/release.yml"
  # GITHUB_TOKEN pushes to data do not trigger another push workflow.
  workflow_run:
    workflows: ["Sync metro data"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: Force publish
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Publish data + typed client
    # A failed matrix leg can coexist with a successful partial publication.
    # Consume the data branch after either result; the fingerprint gate skips
    # unchanged artifacts if the sync published nothing.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Load latest published data
        run: |
          set -euo pipefail
          PUBLISHED_REF=$(git ls-remote --heads origin refs/heads/data)
          if [ -n "$PUBLISHED_REF" ]; then
            git fetch origin +data:refs/remotes/origin/data
            DATA_SHA=$(git rev-parse refs/remotes/origin/data)
            # Published networks win; new networks and code stay at this revision.
            mkdir -p .previous
            git archive "$DATA_SHA" -- data | tar -x -C .previous
            bun run scripts/publish-data.ts merge --previous .previous/data
          fi

      - name: Build (core, adapters, typed client declarations)
        run: bun run build

      - name: Verify canonical data and write manifest
        run: bun run data:verify --out dist/data-manifest.json

      - name: Export OpenAPI document
        run: bun run openapi --out dist/openapi.json

      - name: Stage data bundle
        run: |
          bun run scripts/build-data-bundle.ts --out dist/data
          tar -czf dist/openmetro-data.tar.gz -C dist data

      - name: Stage typed client package
        run: |
          bun run scripts/build-client-package.ts --out dist/client
          cd dist/client
          npm pack --pack-destination ..

      - name: Compute checksums
        run: |
          cd dist
          sha256sum \
            openmetro-data.tar.gz \
            openmetro-client-*.tgz \
            openapi.json \
            data-manifest.json \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Fingerprint the *contents* of the published artifacts, not the tarballs:
      # `npm pack` and `tar` embed mtimes, so packed-file checksums are not
      # stable across rebuilds of identical inputs.
      - name: Compute release fingerprint
        id: fingerprint
        run: |
          DATA_AGGREGATE=$(node -p "require('./dist/data-manifest.json').aggregate")
          OPENAPI_SHA=$(sha256sum dist/openapi.json | awk '{print $1}')
          CLIENT_SHA=$(
            cat dist/client/package.json dist/client/index.d.ts dist/client/index.js \
              dist/client/schemas.d.ts dist/client/schemas.js \
              dist/client/README.md \
              | sha256sum | awk '{print $1}'
          )
          FINGERPRINT=$(
            printf '%s\n%s\n%s\n' "$DATA_AGGREGATE" "$OPENAPI_SHA" "$CLIENT_SHA" \
              | sha256sum | awk '{print $1}'
          )
          {
            echo "data_aggregate=$DATA_AGGREGATE"
            echo "openapi_sha=$OPENAPI_SHA"
            echo "client_sha=$CLIENT_SHA"
            echo "fingerprint=$FINGERPRINT"
          } >> "$GITHUB_OUTPUT"
          echo "fingerprint: $FINGERPRINT"
          echo "  data:    $DATA_AGGREGATE"
          echo "  openapi: $OPENAPI_SHA"
          echo "  client:  $CLIENT_SHA"

      - name: Check whether artifacts changed
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
        run: |
          NEW="${{ steps.fingerprint.outputs.fingerprint }}"
          if [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Forced publish requested."
            exit 0
          fi

          PREV_BODY=$(gh release view --json body -q .body 2>/dev/null || true)
          PREV=$(printf '%s\n' "$PREV_BODY" \
            | sed -n 's/.*Release fingerprint: `\([^`]*\)`.*/\1/p' \
            | head -n 1)

          if [ -n "$PREV" ] && [ "$PREV" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Artifacts unchanged (fingerprint $NEW). Skipping release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Artifacts changed (prev=${PREV:-none}, new=$NEW). Publishing release."
          fi

      - name: Create GitHub release
        if: steps.gate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_AGGREGATE: ${{ steps.fingerprint.outputs.data_aggregate }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          CODE_SHA=$(git rev-parse HEAD)
          TAG="v$(node -p "require('./package.json').version")-r${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            dist/openmetro-data.tar.gz \
            dist/openmetro-client-*.tgz \
            dist/openapi.json \
            dist/data-manifest.json \
            dist/SHA256SUMS.txt \
            --title "$TAG" \
            --notes "Automated release from ${CODE_SHA}.

          - \`openmetro-data.tar.gz\` — canonical dataset (see \`data-manifest.json\`)
          - \`openmetro-client-*.tgz\` — typed Eden Treaty client
          - \`openapi.json\` — OpenAPI 3.0 document
          - \`client\` branch — same typed client, installable as \`github:Naptie/openmetro#client\`

          Data integrity aggregate: \`${DATA_AGGREGATE}\`
          Release fingerprint: \`${FINGERPRINT}\`" \
            --target "$CODE_SHA"

      # Force-push the staged client package as an orphan `client` branch so
      # consumers can depend on `github:Naptie/openmetro#client` without a
      # registry or tarball URL. Same gate as the release: skip when the
      # fingerprint is unchanged.
      - name: Publish to client branch
        if: steps.gate.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          cd dist/client
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan client
          git add .
          git commit -m "chore: publish client [${SHORT_SHA}]"
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin client --force
