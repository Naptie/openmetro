# Periodic sync of canonical metro data.
#
# Schedules:
#   - Weekly (Mon 03:17 UTC): topology + timetables + enrichment per city
#   - Monthly (1st 04:41 UTC): fares per city (OD matrix via operator planners)
#
# Note on network egress:
#   Chinese official metro APIs are not reliably reachable from GitHub-hosted
#   runners. When `OPENMETRO_REVERSE_PROXY` is set (repo secret `REVERSE_PROXY`),
#   adapters rewrite origin URLs to `{proxy}/?url={encoded}`. Every sync
#   fetches the official APIs live.
#
# Discovery is static from packages/adapters/<id>/package.json (`openmetro.networkId`);
# each network is an independent matrix job so one city failing does not block others.
#
# Dest branch is unified: every successful sync is staged as an artifact and
# pushed onto the single long-lived branch `data` (merge into main manually).
# Before applying this run's artifacts, an existing `data` branch is merged
# with `main` so it cannot silently diverge. Merge conflicts outside `data/`
# fail the job; conflicts under `data/` are resolved then fully overwritten
# by this run's staged results.
name: Sync metro data

on:
  schedule:
    - cron: "17 3 * * 1"
    - cron: "41 4 1 * *"
  workflow_dispatch:
    inputs:
      layers:
        description: "Comma-separated layers (topology,timetables,fares,enrichment)"
        required: false
        default: "topology,timetables,enrichment"
      networks:
        description: "Comma-separated network ids or 'all'"
        required: false
        default: "all"

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: sync-${{ github.event_name }}-${{ github.event.inputs.networks || github.event.schedule }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover adapters
    runs-on: ubuntu-latest
    outputs:
      networks: ${{ steps.list.outputs.networks }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - id: list
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.networks }}" != "all" ]; then
            NETS=$(echo "${{ inputs.networks }}" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | jq -R . | jq -s -c .)
          else
            NETS=$(bun run scripts/discover-adapters.ts --json | jq -c '[.[].networkId]')
          fi
          echo "networks=$NETS" >> "$GITHUB_OUTPUT"
          echo "Discovered: $NETS"

  topology:
    name: Topology (${{ matrix.network }})
    needs: discover
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '17 3 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
       (contains(inputs.layers, 'topology') || contains(inputs.layers, 'timetables')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        network: ${{ fromJson(needs.discover.outputs.networks) }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build core (adapters import @openmetro/core)
        run: bun run --cwd packages/core build

      - name: Sync topology
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          OPENMETRO_REVERSE_PROXY: ${{ secrets.REVERSE_PROXY }}
        run: |
          echo "proxy=${OPENMETRO_REVERSE_PROXY:-none}"
          bun run data:sync --network "${{ matrix.network }}" \
            --layer topology,timetables,enrichment

      - name: Verify this network
        run: bun run scripts/verify-data.ts --network "${{ matrix.network }}"

      - name: Stage data artifact if changed
        id: stage
        env:
          NETWORK: ${{ matrix.network }}
        run: |
          if git diff --quiet -- "data/${NETWORK}"; then
            echo "No data changes for ${NETWORK}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .staging/data
          cp -a "data/${NETWORK}" ".staging/data/"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Staged data/${NETWORK} for publish"

      - uses: actions/upload-artifact@v4
        if: steps.stage.outputs.changed == 'true'
        with:
          name: sync-data-${{ matrix.network }}
          path: .staging
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  fares:
    name: Fares (${{ matrix.network }})
    needs: discover
    # Fare planners are also CN-restricted from GHA; skip on schedule and only
    # run when explicitly requested (with reachable egress).
    if: >
      github.event_name == 'workflow_dispatch' && contains(inputs.layers, 'fares')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        network: ${{ fromJson(needs.discover.outputs.networks) }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync fare matrix
        env:
          OPENMETRO_REVERSE_PROXY: ${{ secrets.REVERSE_PROXY }}
        run: bun run data:sync --network "${{ matrix.network }}" --layer fares

      - name: Verify network (including fares.json)
        run: bun run scripts/verify-data.ts --network "${{ matrix.network }}"

      - name: Stage data artifact if changed
        id: stage
        env:
          NETWORK: ${{ matrix.network }}
        run: |
          if git diff --quiet -- "data/${NETWORK}/fares.json"; then
            echo "No fare changes for ${NETWORK}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ".staging/data/${NETWORK}"
          cp -a "data/${NETWORK}/fares.json" ".staging/data/${NETWORK}/"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Staged data/${NETWORK}/fares.json for publish"

      - uses: actions/upload-artifact@v4
        if: steps.stage.outputs.changed == 'true'
        with:
          name: sync-fares-${{ matrix.network }}
          path: .staging
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  publish:
    name: Publish to data branch
    needs: [topology, fares]
    # Run whenever at least one sync leg produced data (matrix legs may
    # fail independently; skipped fares on weekly cron is normal).
    if: >
      always() &&
      (needs.topology.result == 'success' || needs.fares.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Download staged sync data
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sync-*
          merge-multiple: false

      - name: Commit onto data branch
        env:
          BRANCH: data
        run: |
          set -euo pipefail

          # Artifacts nest as artifacts/sync-*/data/<network>/...
          if ! find artifacts -mindepth 2 -maxdepth 2 -type d -name 'data' 2>/dev/null | grep -q .; then
            echo "No staged data artifacts; nothing to publish"
            exit 0
          fi

          # Accumulate on the living data branch when it exists; otherwise fork from main.
          git fetch origin main "$BRANCH" || true

          git config user.name "openmetro-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          merged_main=false
          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            git checkout -B "$BRANCH" "origin/${BRANCH}"
            # Keep the long-lived data branch current with main before staging
            # this run, so a later data→main merge cannot reintroduce stale
            # non-data content or surprise conflicts.
            head_before_merge=$(git rev-parse HEAD)
            if git merge --no-edit origin/main; then
              if [ "$(git rev-parse HEAD)" != "$head_before_merge" ]; then
                merged_main=true
                echo "Merged main into data (fast-forward or merge commit)"
              else
                echo "Data branch already contains main"
              fi
            else
              conflicts=$(git diff --name-only --diff-filter=U || true)
              if [ -z "$conflicts" ]; then
                echo "::error::Merge with main failed but reported no conflicted files"
                exit 1
              fi
              outside=$(printf '%s\n' "$conflicts" | grep -v '^data/' || true)
              if [ -n "$outside" ]; then
                echo "::error::Merge conflicts outside data/; refusing to auto-resolve:"
                printf '%s\n' "$outside"
                echo "Conflicted paths:"
                printf '%s\n' "$conflicts"
                exit 1
              fi
              echo "All merge conflicts are under data/; preferring main, then this run overwrites"
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                # Prefer main's blob so non-synced networks keep the latest merged
                # content; this run's artifacts fully overwrite synced networks below.
                git checkout --theirs -- "$path" 2>/dev/null || true
                if [ -e "$path" ]; then
                  git add -- "$path"
                else
                  # deleted on main, or checkout could not restore a side
                  git rm -f -- "$path" 2>/dev/null || git add -- "$path"
                fi
              done <<< "$conflicts"
              git commit --no-edit
              merged_main=true
              echo "Resolved data/-only conflicts from main"
            fi
          else
            git checkout -B "$BRANCH" origin/main
          fi

          shopt -s nullglob
          applied=0
          # Apply data/* artifacts first, then fares-* so fares.json wins on overlap.
          for root in artifacts/sync-data-*/ artifacts/sync-fares-*/; do
            if [ -d "${root}data" ]; then
              mkdir -p data
              cp -a "${root}data/." data/
              applied=$((applied + 1))
            fi
          done
          if [ "$applied" -eq 0 ]; then
            if [ "$merged_main" = true ]; then
              echo "No data/ trees in artifacts; pushing merge so data is current with main"
              git push -u origin "$BRANCH" --force-with-lease
            else
              echo "No data/ trees in artifacts; nothing to publish"
            fi
            exit 0
          fi

          git add -A data
          if git diff --cached --quiet; then
            if [ "$merged_main" = true ]; then
              echo "Artifacts matched post-merge tree; pushing merge so data is current with main"
              git push -u origin "$BRANCH" --force-with-lease
            else
              echo "Applied artifacts produced no tree changes"
            fi
            exit 0
          fi

          NETWORKS=$(git diff --cached --name-only -- data \
            | sed -n 's|^data/\([^/]*\)/.*|\1|p' \
            | sort -u | paste -sd', ' -)
          git commit -m "data: automated sync (${NETWORKS:-mixed})"
          git push -u origin "$BRANCH" --force-with-lease
          echo "Pushed sync for [${NETWORKS:-mixed}] to ${BRANCH}; merge into main manually."
