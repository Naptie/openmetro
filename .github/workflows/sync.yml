# Periodic sync of canonical metro data.
#
# Schedules:
#   - Weekly (Mon 03:17 UTC): topology + timetables + enrichment per city
#   - Daily (17:05 UTC): adapters declaring `openmetro.syncFrequency: daily`
#   - Fares remain manual opt-in (OD matrix via operator planners)
#
# Note on network egress:
#   Chinese official metro APIs are not reliably reachable from GitHub-hosted
#   runners. When `OPENMETRO_REVERSE_PROXY` is set (repo secret `REVERSE_PROXY`),
#   adapters rewrite origin URLs to `{proxy}/?url={encoded}`. Every sync
#   fetches the official APIs live.
#
# Discovery is static from packages/adapters/<id>/package.json (`openmetro.networkId`);
# each network is an independent matrix job so one city failing does not block others.
#
# Dest branch is unified: every successful sync is staged as an artifact and
# published onto `data`, consumed directly by the deployed API. Each publish
# keeps code from this workflow revision and restores previous successful
# networks before replacing this run's complete artifacts.
name: Sync metro data

on:
  schedule:
    - cron: "17 3 * * 1"
    - cron: "5 17 * * *"
  workflow_dispatch:
    inputs:
      layers:
        description: "Comma-separated layers (topology,timetables,fares,enrichment,gapfill)"
        required: false
        default: "topology,timetables,enrichment"
      networks:
        description: "Comma-separated network ids or 'all'"
        required: false
        default: "all"

permissions:
  contents: write

defaults:
  run:
    shell: bash

# Hold one lock from seeding through publishing: two runs must not derive
# partial-layer snapshots from the same stale data tip. Networks within a run
# still sync in parallel. Long fare runs delay daily refreshes; GitHub keeps
# only one pending run, so newer queued refreshes can replace an older one.
concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  discover:
    name: Discover adapters
    runs-on: ubuntu-latest
    outputs:
      networks: ${{ steps.list.outputs.networks }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - id: list
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.networks }}" != "all" ]; then
            NETS=$(echo "${{ inputs.networks }}" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | jq -R . | jq -s -c .)
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "5 17 * * *" ]; then
            NETS=$(bun run scripts/discover-adapters.ts --json | jq -c '[.[] | select(.syncFrequency == "daily") | .networkId]')
          else
            NETS=$(bun run scripts/discover-adapters.ts --json | jq -c '[.[].networkId]')
          fi
          echo "networks=$NETS" >> "$GITHUB_OUTPUT"
          echo "Discovered: $NETS"

  sync:
    name: Sync (${{ matrix.network }})
    needs: discover
    if: >
      (github.event_name == 'schedule' &&
       (github.event.schedule == '17 3 * * 1' || github.event.schedule == '5 17 * * *')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ contains(inputs.layers, 'fares') && 360 || 30 }}
    env:
      NETWORK: ${{ matrix.network }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        network: ${{ fromJson(needs.discover.outputs.networks) }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build core (adapters import @openmetro/core)
        run: bun run --cwd packages/core build

      - name: Restore this network's last successful publication
        run: bun run scripts/publish-data.ts seed --network "$NETWORK"

      # All requested layers run together so a separate fares artifact cannot
      # overwrite topology/timetables produced by this same workflow run.
      - name: Sync requested layers
        env:
          OPENMETRO_REVERSE_PROXY: ${{ secrets.REVERSE_PROXY }}
          OPENMETRO_BAIDU_AK: ${{ secrets.OPENMETRO_BAIDU_AK }}
          REQUESTED_LAYERS: ${{ inputs.layers }}
        run: |
          echo "proxy=${OPENMETRO_REVERSE_PROXY:-none}"
          LAYERS="${REQUESTED_LAYERS:-topology,timetables,enrichment}"
          bun run data:sync --network "$NETWORK" --layer "$LAYERS"

      - name: Verify and stage data artifact if changed
        id: stage
        env:
          NETWORK: ${{ matrix.network }}
        run: |
          # The loader allows absent timetables; complete publications require them.
          test -s "data/${NETWORK}/timetables.json"
          bun run data:verify --network "$NETWORK"
          # `git diff` ignores untracked files — a brand-new network (e.g. cn-suzhou
          # on its first CI sync) would look "unchanged" and never publish.
          if [ -z "$(git status --porcelain -- "data/${NETWORK}")" ]; then
            echo "No data changes for ${NETWORK}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .staging/data
          cp -a "data/${NETWORK}" ".staging/data/"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Staged data/${NETWORK} for publish"

      - uses: actions/upload-artifact@v4
        if: steps.stage.outputs.changed == 'true'
        with:
          name: sync-data-${{ matrix.network }}
          path: .staging
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  publish:
    name: Publish to data branch
    needs: sync
    # Per-network matrix legs fail independently. Publish when any leg
    # finished (success or failure) — a failed city contributes no artifact and
    # keeps its previous published snapshot; the script no-ops if nothing
    # was staged. Do not require the aggregate sync job to be success.
    if: >
      always() &&
      !cancelled() &&
      (needs.sync.result == 'success' || needs.sync.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Download staged sync data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
          pattern: sync-data-*
          merge-multiple: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Commit onto data branch
        env:
          BRANCH: data
        run: |
          set -euo pipefail

          # Artifacts nest as artifacts/sync-*/data/<network>/...
          if ! find artifacts -mindepth 2 -maxdepth 2 -type d -name 'data' 2>/dev/null | grep -q .; then
            echo "No staged data artifacts; nothing to publish"
            exit 0
          fi

          # Keep this workflow's code revision. Restore only data from the
          # previous publication; a fetch error must not erase that history.
          PREVIOUS_SHA=""
          PREVIOUS_REF=$(git ls-remote --heads origin "refs/heads/${BRANCH}")
          if [ -n "$PREVIOUS_REF" ]; then
            git fetch origin "+${BRANCH}:refs/remotes/origin/${BRANCH}"
            PREVIOUS_SHA=$(git rev-parse "refs/remotes/origin/${BRANCH}")
            mkdir -p .previous
            git archive "$PREVIOUS_SHA" -- data | tar -x -C .previous
          fi

          git config user.name "openmetro-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          bun install --frozen-lockfile
          bun run scripts/publish-data.ts merge --previous .previous/data --artifacts artifacts

          # Refresh quality summary from the overlayed network.json.quality
          # blocks (data/QUALITY.md + data/quality.svg).
          # README is not touched.
          bun run scripts/write-quality-report.ts

          # Verify the actual tree that will be committed, after all overlays
          # and quality updates, before either commit or push can run.
          bun run data:verify
          bun run scripts/publish-data.ts snapshots

          git add -A data
          if git diff --cached --quiet; then
            echo "Artifacts produced no tree changes"
          else
            NETWORKS=$(git diff --cached --name-only -- data \
              | sed -n 's|^data/\([^/]*\)/.*|\1|p' \
              | sort -u | paste -sd', ' -)
            git commit -m "data: automated sync (${NETWORKS:-mixed})"
          fi
          git push origin "HEAD:refs/heads/${BRANCH}" \
            "--force-with-lease=refs/heads/${BRANCH}:${PREVIOUS_SHA}"
          echo "Published complete snapshots to ${BRANCH}"
